packages:
  - 'packages/*'

# Deliberately empty. pnpm 10 blocks dependency install scripts unless they are listed here,
# and nothing in this tree needs one: better-sqlite3 ships prebuilt NAPI binaries for every
# platform we run on, so allowing its script only makes pnpm compile from source — which then
# fails in the container image, where there is no Python and no compiler.
onlyBuiltDependencies: []
