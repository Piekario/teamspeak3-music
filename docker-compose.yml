# Base stack: the bot, the PO-token provider and the web UI.
#
# The per-bot TeamSpeak client containers live in docker-compose.instances.yml, generated
# from instances.json by `pnpm instances:generate`. Bring the whole thing up with:
#
#   docker compose -f docker-compose.yml -f docker-compose.instances.yml up -d
#
# The architectural split that matters: only the TeamSpeak client containers are emulated
# (linux/amd64, no arm64 build exists). The bot — and therefore ffmpeg — stays native and
# reaches each client's PulseAudio over TCP.

services:
  bot:
    build:
      context: .
      dockerfile: docker/bot/Dockerfile
    image: tsmusic/bot:0.1.0
    container_name: tsmusic-bot
    restart: unless-stopped
    environment:
      HTTP_PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN must be set — generate one with: openssl rand -hex 32}"
      DATABASE_PATH: /data/tsmusic.db
      INSTANCES_FILE: /config/instances.json
      YTDLP_BINARY: yt-dlp
      YTDLP_AUTO_UPDATE: "${YTDLP_AUTO_UPDATE:-true}"
      # Set only when a cookies file was actually given, so yt-dlp is never handed the path
      # of a file that is not there. The container path is fixed; the host path is yours.
      YTDLP_COOKIES_FILE: "${YTDLP_COOKIES_FILE:+/config/cookies.txt}"
      YTDLP_PROXY: "${YTDLP_PROXY:-}"
      YTDLP_EXTRACTOR_ARGS: "youtube:player_client=android"
      FFMPEG_BINARY: ffmpeg
      PACTL_BINARY: pactl
      # Which way the bots reach TeamSpeak. `gateway` holds every bot in one process and
      # needs no client container per instance, which is what makes a bot created in the
      # panel work without a second manual step.
      TS3_TRANSPORT: "${TS3_TRANSPORT:-gateway}"
      GATEWAY_URL: "ws://tsmusic-gateway:8080/control"
      GATEWAY_PCM_HOST: tsmusic-gateway
      GATEWAY_PCM_PORT: "8477"
    depends_on:
      - gateway
    volumes:
      - bot-data:/data
      # yt-dlp lives in a volume so it can be updated without an image rebuild.
      - ytdlp:/opt/ytdlp
      # Read-only: the bot reads its instance list, it never rewrites it.
      - ./instances.json:/config/instances.json:ro
      # Cookies from a signed-in YouTube account, needed for anything age-restricted.
      # Defaults to /dev/null so the mount is valid when no file was configured; the
      # environment variable above is what decides whether yt-dlp is told about it.
      - ${YTDLP_COOKIES_FILE:-/dev/null}:/config/cookies.txt:ro
    ports:
      - "8080:8080"
    networks:
      - tsmusic

  # Every bot's TeamSpeak connection, in one .NET process built on TSLib. Control is JSON
  # over a WebSocket; PCM audio arrives on a plain TCP socket, one connection per bot.
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    image: tsmusic/gateway:0.1.0
    container_name: tsmusic-gateway
    restart: unless-stopped
    expose:
      - "8080"
      - "8477"
    networks:
      - tsmusic

  # Supplies PO tokens to yt-dlp. Datacenter IPs get challenged by YouTube; this reduces
  # how often, though nothing eliminates it — cookies remain the stronger lever.


  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: tsmusic/web:0.1.0
    container_name: tsmusic-web
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "8081:80"
    networks:
      - tsmusic

  # Publishes the panel without opening a port on this machine: cloudflared dials out to
  # Cloudflare and traffic comes back down that connection. Nothing listens on the public
  # internet here, and the router needs no forwarding rule.
  #
  # Inert until CLOUDFLARE_TUNNEL_TOKEN is set, so the stack runs unchanged without it.
  # The token identifies one tunnel and carries its credentials — treat it as a secret.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tsmusic-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # Not declared as required: compose interpolates every service whether or not its
      # profile is active, so demanding the token here would break `up` for everyone who
      # does not use the tunnel at all.
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      - web
    networks:
      - tsmusic

volumes:
  bot-data: {}
  ytdlp: {}

networks:
  tsmusic:
    name: tsmusic
