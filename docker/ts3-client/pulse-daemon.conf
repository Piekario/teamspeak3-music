# PulseAudio daemon settings for a headless container.
#
# System mode is discouraged on desktops and correct here: there is no session bus, no
# logind, and several UIDs (root health checks, the `ts3` user) need the same daemon.

daemonize = no
system-instance = yes
disallow-exit = yes
disallow-module-loading = no
exit-idle-time = -1
flat-volumes = no

# No hardware to discover in a container; probing it only produces noise on startup.
load-default-script-file = yes

default-sample-format = s16le
default-sample-rate = 48000
alternate-sample-rate = 48000
default-sample-channels = 2

# Larger fragments trade a little latency for resilience against emulation hiccups.
# A music bot has no interactivity requirement, but underruns are audible as crackling.
default-fragments = 8
default-fragment-size-msec = 25

log-target = stderr
log-level = notice
