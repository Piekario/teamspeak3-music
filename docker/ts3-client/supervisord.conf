[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

# Startup order matters: PulseAudio must own the sink before the client enumerates capture
# devices, and Xvfb must exist before a Qt application tries to open a display. supervisord
# has no dependency graph, so the ordering is enforced by `priority` plus a readiness wait
# in the client's own launcher script.

[program:xvfb]
priority=10
command=/usr/bin/Xvfb :99 -screen 0 1024x768x24 -nolisten tcp
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pulseaudio]
priority=20
command=/usr/bin/pulseaudio --system --disallow-exit --disallow-module-loading=no --log-target=stderr
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ts3client]
priority=30
command=/usr/local/bin/run-ts3client.sh
user=ts3
environment=HOME="/home/ts3",DISPLAY=":99",QT_X11_NO_MITSHM="1"
autorestart=true
startsecs=15
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# VNC exists so the one-time GUI bootstrap (EULA, identity, capture device, ClientQuery API
# key) can be done at all — none of that is reachable headlessly. Off unless ENABLE_VNC=true.
[program:x11vnc]
priority=40
command=/usr/local/bin/run-x11vnc.sh
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
