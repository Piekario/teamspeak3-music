server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The panel is a single-page app: every unknown path is a client-side route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxying the API from the same origin keeps the browser out of CORS entirely and means
    # the frontend needs no build-time knowledge of where the backend lives.
    location /api/ {
        proxy_pass http://bot:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Passed through so the session cookie can carry `Secure` when the browser is on
        # HTTPS. Nothing back here terminates TLS — the tunnel and this proxy both sit in
        # front — so this header is the only way to know.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /ws {
        proxy_pass http://bot:8080;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A live queue view holds its socket open indefinitely; the default 60s read timeout
        # would drop it and make the UI look like it keeps losing the bot.
        proxy_read_timeout 3600s;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
